name: VillagerAhmet
version: 0.1.0
main: dev.ahmet.AhmetPlugin
api-version: '1.21'
load: POSTWORLD
depend: [Citizens]
description: AI villager with bounded world actions and a separate JEV/LLM brain.
commands:
  ahmet:
    description: Manage or speak with Villager Ahmet
    usage: /ahmet <spawn|summon|chest|ask|status|cancel|deliver|items>
permissions:
  ahmet.admin:
    description: Create or summon Ahmet and set the delivery chest.
    default: op
